name: Validate Circle Frame Studio fixes

on:
  push:
    branches:
      - 'fix/v036-render-mask-export-stability'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser smoke tools
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Browser rendering and export smoke test
        run: node scripts/browser-smoke.mjs
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v036-rendering-smoke
          path: artifacts
          if-no-files-found: ignore
