name: KIZE DESIGN TOOL - Windows Build & Startup Check
on:
  push:
    branches: [kize-v0.9.0-group-vector-mask, kize-v0.15.0-selection-palette-photo-foundation]
  pull_request:
    branches: [kize-v0.9.0-group-vector-mask]
    paths:
      - 'kize-desktop/**'
      - '.github/workflows/kize-editor-v04-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build and smoke-test desktop editor
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust stable toolchain (build server only)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kize-desktop/src-tauri
      - name: Install editor dependencies
        working-directory: kize-desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm installation failed' }
      - name: Test pixel operations
        working-directory: kize-desktop
        shell: pwsh
        run: |
          npm run test
          if ($LASTEXITCODE -ne 0) { throw 'Pixel tests failed' }
      - name: Verify no legacy tools in UI
        shell: pwsh
        run: |
          $html = Get-Content 'kize-desktop/index.html' -Raw
          if ($html -match 'id="patternFrame"|id="circleFrame"|data-page="pattern"|data-page="circle"') {
            throw 'Legacy tool entry points still present'
          }
          if ($html -notmatch 'PSD / PSB / PNG' -or $html -notmatch 'guideOn' -or $html -notmatch 'replaceFile') {
            throw 'Required editor controls missing'
          }
      - name: Build editor frontend
        working-directory: kize-desktop
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          if (-not (Test-Path 'dist/index.html')) { throw 'Editor HTML missing' }
      - name: Browser integration - import actual PSD through Web Worker in Microsoft Edge
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-psd.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser PSD import regression test failed' }
      - name: Browser regression - Photoshop merged preview and reachable artboard pan/zoom
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-preview-navigation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PSD composite + pan/zoom browser regression failed' }
      - name: Browser regression - PSD layer color selection and multistop gradients
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-color-editor.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Color selection and gradient E2E regression failed' }
      - name: Browser regression - multi-selection asset recolor and wider middle-pan
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-asset-selection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Multiple PSD asset tint and pan regression test failed' }
      - name: Browser regression - KIZE v2 project archive, undo/redo and PNG export
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-project-roundtrip.mjs
          if ($LASTEXITCODE -ne 0) { throw 'KIZE project round-trip browser regression failed' }
      - name: Browser regression - Photoshop appearance-preserving recolor and round trip
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-appearance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Photoshop preserved appearance pixels regression failed' }
      - name: Browser regression - PSD layer groups, fidelity difference report and safe export
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-fidelity-audit.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PSD fidelity audit E2E test failed' }
      - name: Browser regression - real PSD bitmap masks and clipping visibility
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-mask-clipping.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PSD bitmap mask and clipping regression failed' }
      - name: Browser regression - parent Photoshop group masks and closed vector masks
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-group-vector.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Group/vector PSD mask and KIZE project roundtrip regression failed' }
      - name: Browser regression - real-size preview and color variants ZIP
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-variants.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PNG variation batch + 100% preview E2E test failed' }
      - name: Browser regression - intuitive PNG/PSD color editing and pastel workflow
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-color-workflow.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PNG/PSD exact color, preview, palette and photo numeric E2E failed' }
      - name: Browser regression - PNG all-select and real multicolor palette combination ZIP
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-palette-combination.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Multicolor PNG palette E2E failed' }
      - name: Browser regression - KIZE one-time update badge and manual download
        working-directory: kize-desktop
        shell: pwsh
        run: |
          node tests/browser-update-notice.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update badge and download regression failed' }
      - name: Generate app icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(512,512)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $purple = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(143,126,208))
          $white = [System.Drawing.Brushes]::White
          $g.FillEllipse($purple,24,24,464,464)
          $font = New-Object System.Drawing.Font('Arial',255,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $g.DrawString('K',$font,$white,138,98)
          $bmp.Save('kize-desktop/icon-source.png',[System.Drawing.Imaging.ImageFormat]::Png)
          $font.Dispose(); $purple.Dispose(); $g.Dispose(); $bmp.Dispose()
      - name: Generate Windows ICO
        working-directory: kize-desktop
        shell: pwsh
        run: |
          npx tauri icon icon-source.png --output src-tauri/icons
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
      - name: Build standalone Windows installer without signing secrets
        working-directory: kize-desktop
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne $tauri.version) { throw 'KIZE frontend / installer versions mismatch' }
          npm run desktop
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop compilation failed' }
      - name: Smoke-test Windows app startup (detect immediate crashes)
        shell: pwsh
        run: |
          $app = 'kize-desktop/src-tauri/target/release/kize_design_tool.exe'
          if (-not (Test-Path $app)) { throw "Main app binary is missing: $app" }
          $process = Start-Process -FilePath (Resolve-Path $app) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "KIZE quit immediately after startup (exit $($process.ExitCode)). App startup smoke test failed."
          }
          Write-Host 'KIZE is still running after 8 seconds: startup smoke test passed.'
          Stop-Process -Id $process.Id -Force
      - name: Verify installer exists and size
        shell: pwsh
        run: |
          $dir = 'kize-desktop/src-tauri/target/release/bundle/nsis'
          $setups = @(Get-ChildItem $dir -Filter '*setup.exe' -File -ErrorAction Stop)
          if (-not $setups.Count) { throw 'Setup EXE not generated' }
          foreach ($setup in $setups) {
            if ($setup.Length -lt 500000) { throw "Suspiciously small EXE: $($setup.Name)" }
            Write-Host "KIZE SETUP: $($setup.Name) $($setup.Length) bytes"
          }
      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: KIZE-DESIGN-TOOL-v0.15.0-Windows
          path: kize-desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish KIZE manual-download release (no signing keys needed)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/kize-v0.9.0-group-vector-mask' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content 'kize-desktop/package.json' -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid KIZE release version' }
          $tag = "kize-v$version"
          $existing = @(gh release list --repo $env:GH_REPO --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing GitHub Releases' }
          if ($existing | Where-Object { $_.tagName -eq $tag }) {
            Write-Host "KIZE release $tag already published. Bump package version to release new changes."
            exit 0
          }
          $dir = 'kize-desktop/src-tauri/target/release/bundle/nsis'
          $setups = @(Get-ChildItem $dir -File -Filter '*setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one Windows setup executable' }
          $setup = $setups[0]
          $zip = "KIZE-DESIGN-TOOL-v$version-Windows.zip"
          Compress-Archive -LiteralPath $setup.FullName -DestinationPath $zip -Force
          if ((Get-Item $zip).Length -lt 500000) { throw 'Release ZIP is suspiciously small' }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$sha256  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          $notesFile = 'kize-desktop/RELEASE_NOTES_KR.md'
          if (-not (Test-Path $notesFile)) { throw 'KIZE release notes are missing' }
          $notes = Get-Content $notesFile -Raw -Encoding UTF8
          if (-not $notes.StartsWith("KIZE DESIGN TOOL v$version")) {
            throw 'Release notes must start with matching KIZE version'
          }
          gh release create $tag $setup.FullName $zip "$zip.sha256" --repo $env:GH_REPO --target $env:GITHUB_SHA --title "KIZE DESIGN TOOL v$version" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }
          Write-Host "KIZE release $tag published with EXE, ZIP and SHA-256."
