name: Package Circle Frame Studio v0.22

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Circle-Frame-Studio-v0.22
          if-no-files-found: error
          retention-days: 30
          path: |
            README.md
            V*_PLAN.md
            index.html
            package.json
            package-lock.json
            tsconfig.app.json
            tsconfig.json
            tsconfig.node.json
            vite.config.ts
            wrangler.jsonc
            src
